name: GSP deployment monitor

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  record-cloudflare-deployment:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Cloudflare Pages deployment
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: "142e18197e02f41dbdf9b1014d4ef126"
          CF_PROJECT_NAME: "gestion-stock-pro"
          GSP_MONITOR_WEBHOOK_SECRET: ${{ secrets.GSP_MONITOR_WEBHOOK_SECRET }}
          MONITOR_URL: "https://kguywkmfiddztkpotmbo.supabase.co/functions/v1/platform-telemetry"
          EXPECTED_SHA: ${{ github.sha }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          if [ -z "${CF_API_TOKEN:-}" ] || [ -z "${GSP_MONITOR_WEBHOOK_SECRET:-}" ]; then
            echo "Missing CLOUDFLARE_API_TOKEN or GSP_MONITOR_WEBHOOK_SECRET GitHub secret; skipping telemetry."
            exit 0
          fi

          for attempt in $(seq 1 45); do
            RESPONSE=$(curl -fsS \
              -H "Authorization: Bearer $CF_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/pages/projects/$CF_PROJECT_NAME/deployments?per_page=20")

            MATCH=$(echo "$RESPONSE" | jq -c --arg sha "$EXPECTED_SHA" '.result[] | select(.deployment_trigger.metadata.commit_hash == $sha)' | head -n 1 || true)
            if [ -n "$MATCH" ]; then
              DEPLOYMENT_ID=$(echo "$MATCH" | jq -r '.id')
              DEPLOYMENT_URL=$(echo "$MATCH" | jq -r '.url // empty')
              ENVIRONMENT=$(echo "$MATCH" | jq -r '.environment // "production"')
              CREATED_ON=$(echo "$MATCH" | jq -r '.created_on // empty')
              FINISHED_ON=$(echo "$MATCH" | jq -r '.latest_stage.ended_on // empty')
              RAW_STATUS=$(echo "$MATCH" | jq -r '.latest_stage.status // "building"')
              BRANCH=$(echo "$MATCH" | jq -r '.deployment_trigger.metadata.branch // "main"')
              SHA=$(echo "$MATCH" | jq -r '.deployment_trigger.metadata.commit_hash // empty')
              MESSAGE=$(echo "$MATCH" | jq -r '.deployment_trigger.metadata.commit_message // empty')
              case "$RAW_STATUS" in
                success) STATUS="success" ;;
                failure|failed) STATUS="failed" ;;
                canceled|cancelled) STATUS="canceled" ;;
                *) STATUS="building" ;;
              esac

              jq -n \
                --arg type "deployment" \
                --arg deployment_id "$DEPLOYMENT_ID" \
                --arg deployment_url "$DEPLOYMENT_URL" \
                --arg environment "$ENVIRONMENT" \
                --arg commit_sha "$SHA" \
                --arg commit_message "${MESSAGE:-$COMMIT_MESSAGE}" \
                --arg status "$STATUS" \
                --arg started_at "$CREATED_ON" \
                --arg finished_at "$FINISHED_ON" \
                --arg branch "$BRANCH" \
                '{type:$type,deployment_id:$deployment_id,deployment_url:$deployment_url,environment:$environment,commit_sha:$commit_sha,commit_message:$commit_message,status:$status,started_at:(if $started_at=="" then null else $started_at end),finished_at:(if $finished_at=="" then null else $finished_at end),branch:$branch}' > payload.json

              curl -fsS -X POST "$MONITOR_URL" \
                -H "Content-Type: application/json" \
                -H "x-monitor-secret: $GSP_MONITOR_WEBHOOK_SECRET" \
                --data-binary @payload.json
              echo "Recorded Cloudflare Pages deployment $DEPLOYMENT_ID ($STATUS)."
              exit 0
            fi
            echo "Deployment for $EXPECTED_SHA not available yet (attempt $attempt/45)."
            sleep 20
          done

          echo "No matching Cloudflare deployment found within 15 minutes; no deployment record was sent."
