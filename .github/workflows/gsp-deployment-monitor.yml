name: GSP deployment monitor

on:
  workflow_run:
    workflows:
      - Build verification
    types:
      - completed
    branches:
      - main

permissions:
  contents: read
  actions: read

jobs:
  record-build-and-deployment:
    runs-on: ubuntu-latest
    steps:
      - name: Record CI build result and optional Cloudflare deployment
        env:
          GSP_MONITOR_WEBHOOK_SECRET: ${{ secrets.GSP_MONITOR_WEBHOOK_SECRET }}
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: "142e18197e02f41dbdf9b1014d4ef126"
          CF_PROJECT_NAME: "gestion-stock-pro"
          MONITOR_URL: "https://kguywkmfiddztkpotmbo.supabase.co/functions/v1/platform-telemetry"
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_BRANCH: ${{ github.event.workflow_run.head_branch }}
          RUN_MESSAGE: ${{ github.event.workflow_run.head_commit.message }}
          RUN_STARTED: ${{ github.event.workflow_run.run_started_at }}
          RUN_FINISHED: ${{ github.event.workflow_run.updated_at }}
        run: |
          set -euo pipefail
          if [ -z "${GSP_MONITOR_WEBHOOK_SECRET:-}" ]; then
            echo "Missing GSP_MONITOR_WEBHOOK_SECRET; monitoring events were not sent."
            exit 0
          fi

          case "$RUN_CONCLUSION" in
            success) BUILD_STATUS="success" ;;
            failure) BUILD_STATUS="failed" ;;
            cancelled) BUILD_STATUS="canceled" ;;
            *) BUILD_STATUS="unknown" ;;
          esac

          jq -n \
            --arg type "deployment" \
            --arg provider "github_actions" \
            --arg deployment_id "github-actions-$RUN_ID-$RUN_ATTEMPT" \
            --arg deployment_url "$RUN_URL" \
            --arg commit_sha "$RUN_SHA" \
            --arg commit_message "${RUN_MESSAGE:-Build verification}" \
            --arg status "$BUILD_STATUS" \
            --arg started_at "$RUN_STARTED" \
            --arg finished_at "$RUN_FINISHED" \
            --arg branch "$RUN_BRANCH" \
            '{type:$type,provider:$provider,deployment_id:$deployment_id,deployment_url:$deployment_url,environment:"production",commit_sha:$commit_sha,commit_message:$commit_message,status:$status,started_at:(if $started_at=="" then null else $started_at end),finished_at:(if $finished_at=="" then null else $finished_at end),branch:$branch}' > build-payload.json

          curl -fsS -X POST "$MONITOR_URL" \
            -H "Content-Type: application/json" \
            -H "x-monitor-secret: $GSP_MONITOR_WEBHOOK_SECRET" \
            --data-binary @build-payload.json
          echo "Recorded GitHub build result: $BUILD_STATUS."

          if [ -z "${CF_API_TOKEN:-}" ]; then
            echo "CLOUDFLARE_API_TOKEN is not configured; Cloudflare Pages deployment details are skipped."
            exit 0
          fi

          for attempt in $(seq 1 45); do
            RESPONSE=$(curl -fsS \
              -H "Authorization: Bearer $CF_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/pages/projects/$CF_PROJECT_NAME/deployments?per_page=20")
            MATCH=$(echo "$RESPONSE" | jq -c --arg sha "$RUN_SHA" '.result[] | select(.deployment_trigger.metadata.commit_hash == $sha)' | head -n 1 || true)
            if [ -n "$MATCH" ]; then
              DEPLOYMENT_ID=$(echo "$MATCH" | jq -r '.id')
              DEPLOYMENT_URL=$(echo "$MATCH" | jq -r '.url // empty')
              ENVIRONMENT=$(echo "$MATCH" | jq -r '.environment // "production"')
              CREATED_ON=$(echo "$MATCH" | jq -r '.created_on // empty')
              FINISHED_ON=$(echo "$MATCH" | jq -r '.latest_stage.ended_on // empty')
              RAW_STATUS=$(echo "$MATCH" | jq -r '.latest_stage.status // "building"')
              case "$RAW_STATUS" in
                success) CF_STATUS="success" ;;
                failure|failed) CF_STATUS="failed" ;;
                canceled|cancelled) CF_STATUS="canceled" ;;
                *) CF_STATUS="building" ;;
              esac

              jq -n \
                --arg type "deployment" \
                --arg provider "cloudflare_pages" \
                --arg deployment_id "$DEPLOYMENT_ID" \
                --arg deployment_url "$DEPLOYMENT_URL" \
                --arg environment "$ENVIRONMENT" \
                --arg commit_sha "$RUN_SHA" \
                --arg commit_message "${RUN_MESSAGE:-Cloudflare Pages deployment}" \
                --arg status "$CF_STATUS" \
                --arg started_at "$CREATED_ON" \
                --arg finished_at "$FINISHED_ON" \
                --arg branch "$RUN_BRANCH" \
                '{type:$type,provider:$provider,deployment_id:$deployment_id,deployment_url:$deployment_url,environment:$environment,commit_sha:$commit_sha,commit_message:$commit_message,status:$status,started_at:(if $started_at=="" then null else $started_at end),finished_at:(if $finished_at=="" then null else $finished_at end),branch:$branch}' > cloudflare-payload.json

              curl -fsS -X POST "$MONITOR_URL" \
                -H "Content-Type: application/json" \
                -H "x-monitor-secret: $GSP_MONITOR_WEBHOOK_SECRET" \
                --data-binary @cloudflare-payload.json
              echo "Recorded Cloudflare Pages deployment $DEPLOYMENT_ID ($CF_STATUS)."
              exit 0
            fi
            echo "Waiting for Cloudflare deployment for $RUN_SHA (attempt $attempt/45)."
            sleep 20
          done

          echo "No Cloudflare Pages deployment found for $RUN_SHA. The CI build record remains available."
